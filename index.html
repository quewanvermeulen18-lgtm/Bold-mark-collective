<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Bold Mark Collective</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #C9A96E;
            --gold-light: #E0C99A;
            --gold-dark: #A68B4B;
            --grey-100: #0F0F0F;
            --grey-150: #141414;
            --grey-200: #1A1A1A;
            --grey-300: #2A2A2A;
            --grey-400: #3A3A3A;
            --grey-500: #555555;
            --grey-600: #777777;
            --grey-700: #999999;
            --grey-800: #B0B0B0;
            --grey-900: #CCCCCC;
            --white: #E5E5E5;
            --black: #0A0A0A;
            --card-bg: #161616;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--grey-100);
            color: var(--grey-700);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ===================== POPUP MODAL ===================== */
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }
        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .popup-box {
            background: var(--grey-150);
            border: 1px solid var(--gold-dark);
            border-radius: 20px;
            padding: 3rem;
            max-width: 480px;
            width: 90%;
            position: relative;
            transform: scale(0.9) translateY(20px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 25px 80px rgba(0,0,0,0.6), 0 0 40px rgba(201, 169, 110, 0.08);
        }
        .popup-overlay.active .popup-box {
            transform: scale(1) translateY(0);
        }
        .popup-close {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            width: 36px;
            height: 36px;
            background: transparent;
            border: 1px solid var(--gold-dark);
            border-radius: 50%;
            color: var(--grey-600);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .popup-close:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: rotate(90deg);
        }
        .popup-box h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: var(--white);
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .popup-box p {
            color: var(--grey-600);
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        .popup-box .popup-form input[type="email"] {
            width: 100%;
            padding: 1rem 1.2rem;
            background: var(--black);
            border: 1px solid var(--grey-400);
            border-radius: 8px;
            color: var(--white);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        .popup-box .popup-form input[type="email"]:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(201, 169, 110, 0.1);
        }
        .popup-box .popup-form input[type="email"]::placeholder {
            color: var(--grey-800);
        }
        .popup-box .popup-form button {
            width: 100%;
            padding: 1rem;
            background: var(--gold);
            color: var(--black);
            border: 2px solid var(--gold);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
        }
        .popup-box .popup-form button:hover {
            background: transparent;
            color: var(--gold);
        }
        .popup-box .popup-note {
            font-size: 0.75rem;
            color: var(--grey-500);
            text-align: center;
            margin-top: 1rem;
        }
        .popup-message {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--gold);
            min-height: 1.5rem;
        }

        /* ===================== NAVIGATION ===================== */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--gold-dark);
            transition: all 0.4s ease;
        }
        nav.scrolled {
            padding: 0.8rem 5%;
            background: rgba(10, 10, 10, 0.98);
            box-shadow: 0 4px 30px rgba(201, 169, 110, 0.08);
        }
        .nav-logo {
            height: 48px;
            background: var(--black);
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid var(--gold-dark);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .nav-logo:hover { transform: scale(1.05) rotateY(10deg); }
        .nav-logo img { height: 100%; width: auto; display: block; }
        .nav-links { display: flex; gap: 2.5rem; list-style: none; }
        .nav-links a {
            text-decoration: none;
            color: var(--grey-600);
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            position: relative;
            transition: color 0.3s ease;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: width 0.3s ease;
        }
        .nav-links a:hover { color: var(--gold); }
        .nav-links a:hover::after { width: 100%; }
        .nav-links a.active { color: var(--gold); }

        /* ===================== HAMBURGER MENU ===================== */
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 36px;
            height: 36px;
            cursor: pointer;
            background: transparent;
            border: 1px solid var(--gold-dark);
            border-radius: 6px;
            padding: 6px;
            gap: 5px;
            transition: all 0.3s ease;
            z-index: 1100;
        }
        .hamburger:hover {
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(201, 169, 110, 0.15);
        }
        .hamburger span {
            display: block;
            width: 20px;
            height: 2px;
            background: var(--gold);
            border-radius: 1px;
            transition: all 0.3s ease;
            transform-origin: center;
        }
        .hamburger.active span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }
        .mobile-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 280px;
            height: 100vh;
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(30px);
            border-left: 1px solid var(--gold-dark);
            padding: 6rem 2rem 2rem;
            transition: right 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1050;
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .mobile-menu.active { right: 0; }
        .mobile-menu a {
            color: var(--grey-600);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 1.2rem 0;
            border-bottom: 1px solid rgba(201, 169, 110, 0.1);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .mobile-menu a::before {
            content: '';
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: width 0.3s ease;
        }
        .mobile-menu a:hover {
            color: var(--gold);
            padding-left: 0.5rem;
        }
        .mobile-menu a:hover::before { width: 20px; }
        .mobile-menu a.active { color: var(--gold); }
        .mobile-menu a.active::before { width: 20px; }
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1040;
        }
        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* ===================== HERO ===================== */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 8rem 2rem 4rem;
            overflow: hidden;
            background: var(--black);
        }
        .hero-bg-pattern {
            position: absolute;
            inset: 0;
            opacity: 0.05;
            background-image: radial-gradient(circle at 25% 25%, var(--gold) 1px, transparent 1px),
                              radial-gradient(circle at 75% 75%, var(--gold) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: patternFloat 25s linear infinite;
        }
        @keyframes patternFloat {
            0% { transform: translate(0, 0); }
            100% { transform: translate(25px, 25px); }
        }
        .hero-logo-container {
            background: var(--black);
            padding: 4rem 5rem;
            border-radius: 24px;
            margin-bottom: 2rem;
            border: 2px solid var(--gold);
            box-shadow: 0 0 60px rgba(201, 169, 110, 0.15),
                        0 20px 60px rgba(0,0,0,0.6),
                        inset 0 0 60px rgba(201, 169, 110, 0.02);
            transform-style: preserve-3d;
            animation: heroFloat 6s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }
        .hero-logo-container::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: conic-gradient(transparent, rgba(201, 169, 110, 0.06), transparent 30%);
            animation: rotate 5s linear infinite;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        @keyframes heroFloat {
            0%, 100% { transform: translateY(0) rotateX(0deg) rotateY(0deg); }
            50% { transform: translateY(-18px) rotateX(2deg) rotateY(2deg); }
        }
        .hero-logo {
            height: 220px;
            width: auto;
            display: block;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 0 25px rgba(201, 169, 110, 0.25));
        }
        .hero-tagline {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.4rem, 3.5vw, 2.2rem);
            color: var(--gold);
            font-style: italic;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
            text-align: center;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(201, 169, 110, 0.15);
        }
        .hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 700;
            color: var(--white);
            text-align: center;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }
        .hero h1 span { color: var(--gold); font-style: italic; }
        .hero-subtitle {
            font-size: clamp(1.15rem, 2.5vw, 1.4rem);
            color: var(--grey-800);
            text-align: center;
            max-width: 550px;
            margin-bottom: 2rem;
            font-weight: 400;
            line-height: 1.7;
        }

        /* GET A QUOTE Button */
        .quote-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1.1rem 3.5rem;
            background: var(--gold);
            color: var(--black);
            text
